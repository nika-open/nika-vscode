# Final README redirect release of the two old identifiers. Full legacy
# functionality remains available. Only after the matching canonical version
# exists in both public registries.
# legacy-release.yml — tag-gated publish (OpenVSX + VS Marketplace).
#
# Push a `legacy-v<version>` tag on the code of the canonical `v<version>`
# → build one VSIX per old identifier, supernovae.nika and
# supernovae.nika-lang, each under its own identity with a README that
# points to nika-open.nika → publish each to both registries. Every gate
# passes before anything publishes: a green tag means all four publishes ran.
# Linux runner ON PURPOSE: Windows-built VSIXes drop the POSIX executable
# bit, which breaks any bundled binary (PUBLISHING.md §platform-specific).
# Injection-safe: no github.event data is interpolated anywhere.
#
# Registry identity · trusted publishing (OIDC), as in release.yml:
#   VS Marketplace · the old publisher supernovae trusts this repository and
#                    this file (policy « Legacy release workflow »):
#                    `vsce publish --oidc`, no Marketplace secret.
#   OpenVSX        · the OVSX_PAT secret while it exists (an open-vsx.org
#                    token of a supernovae namespace member); without it, the
#                    trusted publisher registered for each old extension and
#                    this file (PUBLISHING.md §Final old-identifier redirect
#                    release).

name: legacy identifier final release

on:
  push:
    tags:
      - 'legacy-v[0-9]+.[0-9]+.[0-9]+'

# The workflow token only reads the repository. The publish job alone may
# also request an OIDC token, which a registry exchanges for a short-lived
# publishing credential; the gate, which runs every dev dependency, never can.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        legacy: [nika, nika-lang]
    env:
      LEGACY: ${{ matrix.legacy }}
      VSIX: supernovae.${{ matrix.legacy }}.vsix
    defaults:
      run:
        working-directory: legacy-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22 # vsce 4 and ovsx 1.4 floor
          cache: npm
      - name: Prepare the final source of the old identifier
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/check-canonical-listings.mjs
          node scripts/prepare-legacy-release.mjs legacy-source "$LEGACY"
      - run: npm ci
      - name: Dependency audit
        # Any advisory at low or above blocks publication, except the
        # exceptions of scripts/release-audit.mjs (PUBLISHING.md
        # §Dependency audit).
        run: node scripts/release-audit.mjs
      # The tag IS the version claim — refuse a mislabeled VSIX before
      # anything builds (a tag/manifest drift must never publish).
      - name: The manifest matches the tag
        run: |
          v="$(node -p "require('./package.json').version")"
          test "legacy-v$v" = "$GITHUB_REF_NAME" || { echo "manifest $v != tag $GITHUB_REF_NAME"; exit 1; }
      # compile = typecheck + esbuild bundle → out/extension.js, which the
      # parity check (run by `npm test`) asserts exists before packaging.
      - run: npm run compile
      - run: npm test # vitest (contract suite self-skips without a binary) + parity
      # The pinned engine REFUSES a permits-declaring workflow with exec
      # children when the host cannot jail them (NIKA_SANDBOX=auto · the
      # fail-closed policy). The first-contact demo declares exec permits,
      # so on a runner without bubblewrap its run never starts, no journal
      # appears, and the suite times out (measured 2026-09-01 · run
      # 33570485552 · green on macOS where seatbelt exists). ci.yml's belt
      # installs the jail before the same suites; this gate must too, or it
      # is a fossil twin that goes red only at tag time.
      - name: Install bubblewrap (the exec jail the pinned engine requires)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          # Without this the jail starts and dies with status 1 (the demo's
          # printf: « NIKA-SEC-001 · landlock/bwrap refused the confined
          # process » · measured 2026-09-02 · run 33577500959) — the belt
          # has carried this line since its jail step was written.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real VS Code hosts against the checksum-verified ENGINE_PIN asset
        run: xvfb-run -a npm run test:integration
      - run: npx vsce package --no-dependencies -o "$VSIX"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-${{ matrix.legacy }}
          path: legacy-source/${{ env.VSIX }}

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each old identifier publishes on its own: one failing never cancels
    # the other between its two registries.
    strategy:
      fail-fast: false
      matrix:
        legacy: [nika, nika-lang]
    env:
      VSIX: supernovae.${{ matrix.legacy }}.vsix
    # The only job that can mint an OIDC token. It runs no repository code
    # and restores no Actions cache: the two publishing CLIs come from the
    # lockfile without install scripts, and npx never fetches anything else.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix-${{ matrix.legacy }}
      # Both registries refuse a version that already exists, and nothing
      # here asks them to ignore it: « already exists » does not prove the
      # registry holds the bytes this run built.
      - name: Publish to OpenVSX (Cursor · Windsurf · VSCodium)
        env:
          # Deleted once both old extensions trust this file (see the header).
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -n "$OVSX_PAT" ]; then
            npx --no-install ovsx publish "$VSIX"
          else
            npx --no-install ovsx publish "$VSIX" --trusted-publishing
          fi
      - name: Publish to VS Marketplace (trusted publishing)
        run: npx --no-install vsce publish --oidc --packagePath "$VSIX"
