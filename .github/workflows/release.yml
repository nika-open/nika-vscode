# release.yml — tag-gated publish (OpenVSX + VS Marketplace).
#
# Push a `v*` tag → package the VSIX once → publish the identical artifact
# to both registries. One VSIX, two registries: a green tag means both
# publishes ran.
# Linux runner ON PURPOSE: Windows-built VSIXes drop the POSIX executable
# bit, which breaks any bundled binary (PUBLISHING.md §platform-specific).
# Injection-safe: no github.event data is interpolated anywhere.
#
# Registry identity · trusted publishing (OIDC), no Marketplace secret:
#   VS Marketplace · the publisher nika-open trusts this repository and this
#                    file (policy « Release workflow »): `vsce publish --oidc`
#                    exchanges the publish job's GitHub token for a
#                    Marketplace credential that lasts 15 minutes.
#   OpenVSX        · a trusted publisher can only be registered for an
#                    extension that already has a version, so the FIRST
#                    nika-open.nika version goes out with the OVSX_PAT secret
#                    (an open-vsx.org token of a nika-open namespace owner).
#                    Then register the trusted publisher for nika-open.nika
#                    and delete OVSX_PAT: the same step exchanges the job's
#                    token from then on (PUBLISHING.md §Live release CI).

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# The workflow token only reads the repository. The publish job alone may
# also request an OIDC token, which a registry exchanges for a short-lived
# publishing credential; the gate, which runs every dev dependency, never can.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22 # vsce 4 and ovsx 1.4 floor
          cache: npm
      - run: npm ci
      - name: Dependency audit
        # The release lock currently has zero findings. Keep that claim
        # monotone: low means any future advisory blocks publication.
        run: npm audit --audit-level=low
      # The tag IS the version claim — refuse a mislabeled VSIX before
      # anything builds (a tag/manifest drift must never publish).
      - name: The manifest matches the tag
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "manifest $v != tag $GITHUB_REF_NAME"; exit 1; }
      # compile = typecheck + esbuild bundle → out/extension.js, which the
      # parity check (run by `npm test`) asserts exists before packaging.
      - run: npm run compile
      - run: npm test # vitest (contract suite self-skips without a binary) + parity
      # The pinned engine REFUSES a permits-declaring workflow with exec
      # children when the host cannot jail them (NIKA_SANDBOX=auto · the
      # fail-closed policy). The first-contact demo declares exec permits,
      # so on a runner without bubblewrap its run never starts, no journal
      # appears, and the suite times out (measured 2026-09-01 · run
      # 33570485552 · green on macOS where seatbelt exists). ci.yml's belt
      # installs the jail before the same suites; this gate must too, or it
      # is a fossil twin that goes red only at tag time.
      - name: Install bubblewrap (the exec jail the pinned engine requires)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          # Without this the jail starts and dies with status 1 (the demo's
          # printf: « NIKA-SEC-001 · landlock/bwrap refused the confined
          # process » · measured 2026-09-02 · run 33577500959) — the belt
          # has carried this line since its jail step was written.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real VS Code hosts against the checksum-verified ENGINE_PIN asset
        run: xvfb-run -a npm run test:integration
      - run: npx vsce package --no-dependencies -o nika.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: nika.vsix

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can mint an OIDC token. It runs no repository code
    # and restores no Actions cache: the two publishing CLIs come from the
    # lockfile without install scripts, and npx never fetches anything else.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
      # Both registries refuse a version that already exists, and nothing
      # here asks them to ignore it: « already exists » does not prove the
      # registry holds the bytes this run built.
      - name: Publish to OpenVSX (Cursor · Windsurf · VSCodium)
        env:
          # Set only for the first nika-open.nika version (see the header).
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -n "$OVSX_PAT" ]; then
            npx --no-install ovsx publish nika.vsix
          else
            npx --no-install ovsx publish nika.vsix --trusted-publishing
          fi
      - name: Publish to VS Marketplace (trusted publishing)
        run: npx --no-install vsce publish --oidc --packagePath nika.vsix
